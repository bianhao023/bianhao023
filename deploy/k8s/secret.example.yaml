# =============================================================================
# EXAMPLE Secret — DO NOT commit real values.
# Copy this file to secret.yaml, replace every PLACEHOLDER with a real value,
# then apply it:  kubectl apply -f secret.yaml
# secret.yaml should be git-ignored / managed by your secret store (Vault, SOPS,
# Sealed Secrets, External Secrets, etc.).
# stringData lets you provide plain (unencoded) values; Kubernetes base64-encodes
# them for you.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: vpn-payment-secret
  namespace: vpn-payment
  labels:
    app.kubernetes.io/name: vpn-payment
    app.kubernetes.io/instance: vpn-payment
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: vpn-payment
type: Opaque
stringData:
  # --- Admin ---
  ADMIN_TOKEN: "REPLACE_WITH_ADMIN_TOKEN"
  # --- WeChat Pay ---
  WECHAT_APP_ID: "REPLACE_WITH_WECHAT_APP_ID"
  WECHAT_MCH_ID: "REPLACE_WITH_WECHAT_MCH_ID"
  WECHAT_PRIVATE_KEY: "REPLACE_WITH_WECHAT_PRIVATE_KEY"
  WECHAT_SERIAL_NO: "REPLACE_WITH_WECHAT_SERIAL_NO"
  WECHAT_API_V3_KEY: "REPLACE_WITH_WECHAT_API_V3_KEY"
  WECHAT_PLATFORM_PUBLIC_KEY: "REPLACE_WITH_WECHAT_PLATFORM_PUBLIC_KEY"
  WECHAT_NOTIFY_URL: "https://vpn-pay.example.com/webhooks/wechat"
  # --- Alipay ---
  ALIPAY_APP_ID: "REPLACE_WITH_ALIPAY_APP_ID"
  ALIPAY_PRIVATE_KEY: "REPLACE_WITH_ALIPAY_PRIVATE_KEY"
  ALIPAY_PUBLIC_KEY: "REPLACE_WITH_ALIPAY_PUBLIC_KEY"
  ALIPAY_NOTIFY_URL: "https://vpn-pay.example.com/webhooks/alipay"
  # --- USDT (TRON) ---
  USDT_RECEIVING_ADDRESS: "REPLACE_WITH_USDT_RECEIVING_ADDRESS"
  USDT_API_KEY: "REPLACE_WITH_USDT_API_KEY"
  # --- SMTP (email notifications) ---
  SMTP_HOST: "REPLACE_WITH_SMTP_HOST"
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: "REPLACE_WITH_SMTP_USER"
  SMTP_PASS: "REPLACE_WITH_SMTP_PASS"
  SMTP_FROM: "no-reply@example.com"
