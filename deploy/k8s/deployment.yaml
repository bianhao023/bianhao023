apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpn-payment
  namespace: vpn-payment
  labels:
    app.kubernetes.io/name: vpn-payment
    app.kubernetes.io/instance: vpn-payment
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: vpn-payment
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vpn-payment
      app.kubernetes.io/instance: vpn-payment
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vpn-payment
        app.kubernetes.io/instance: vpn-payment
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: vpn-payment
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vpn-payment
          image: vpn-payment-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vpn-payment-config
            - secretRef:
                name: vpn-payment-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
