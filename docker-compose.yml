services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      ORDER_TTL_MINUTES: ${ORDER_TTL_MINUTES:-15}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # WeChat Pay
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID:-}
      WECHAT_PRIVATE_KEY: ${WECHAT_PRIVATE_KEY:-}
      WECHAT_SERIAL_NO: ${WECHAT_SERIAL_NO:-}
      WECHAT_API_V3_KEY: ${WECHAT_API_V3_KEY:-}
      WECHAT_PLATFORM_PUBLIC_KEY: ${WECHAT_PLATFORM_PUBLIC_KEY:-}
      WECHAT_NOTIFY_URL: ${WECHAT_NOTIFY_URL:-}
      # Alipay
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      # USDT (TRC20)
      USDT_RECEIVING_ADDRESS: ${USDT_RECEIVING_ADDRESS:-}
      USDT_CONTRACT_ADDRESS: ${USDT_CONTRACT_ADDRESS:-}
      USDT_API_BASE: ${USDT_API_BASE:-https://api.trongrid.io}
      USDT_API_KEY: ${USDT_API_KEY:-}
      USDT_MIN_CONFIRMATIONS: ${USDT_MIN_CONFIRMATIONS:-19}
    # To enable Postgres-backed storage, provide a DATABASE_URL and wire the
    # SqlRepository implementations in your container (see src/storage/sql).
    # depends_on:
    #   - db

